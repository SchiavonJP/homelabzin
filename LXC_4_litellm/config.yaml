general_settings:
  request_timeout: 600

model_list:
  # ===== Defaults =====
  - model_name: default-agent
    litellm_params:
      model: openrouter/nvidia/nemotron-3-super-120b-a12b:free
      api_key: os.environ/OPENROUTER_API_KEY

  # ===== OpenRouter Free =====

  - model_name: coder
    litellm_params:
      model: openrouter/qwen/qwen3-coder:free
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: reasoning
    litellm_params:
      model: openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: agent
    litellm_params:
      model: openrouter/nvidia/nemotron-3-super-120b-a12b:free
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: writer
    litellm_params:
      model: openrouter/qwen/qwen3-next-80b-a3b-instruct:free
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: extraction
    litellm_params:
      model: openrouter/google/gemma-4-31b-it:free
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: fast
    litellm_params:
      model: openrouter/google/gemma-4-26b-a4b-it:free
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: oss
    litellm_params:
      model: openrouter/openai/gpt-oss-120b:free
      api_key: os.environ/OPENROUTER_API_KEY

  - model_name: free-auto
    litellm_params:
      model: openrouter/openrouter/free
      api_key: os.environ/OPENROUTER_API_KEY

  # ===== Local (LXC 8 — Apollo, RTX 3060) =====

  - model_name: local-coder
    litellm_params:
      model: openai/gemma-4-12b-it
      api_base: http://192.168.0.217:8080/v1
      api_key: "none"
      timeout: 600

  - model_name: local-fast
    litellm_params:
      model: openai/gemma-4-12b-it
      api_base: http://192.168.0.217:8080/v1
      api_key: "none"
      timeout: 600

  - model_name: embed
    litellm_params:
      model: openai/bge-m3
      api_base: http://192.168.0.217:8081/v1
      api_key: "none"

  # ===== Remoto (UFSC — via túnel IKEv2, ver LXC_4_litellm/vpn/) =====
  # Só modelos que não têm equivalente já coberto por Apollo (12-35B) ou
  # pelo free tier do OpenRouter — sem sentido duplicar isso com latência
  # extra de VPN. Critério de cada um documentado inline.

  # Dois clusters da UFSC, mesmo Basic Auth do vlab não é exigido no ceos
  # (testado manualmente). Modelos que existem nos dois (llama3.3:70b,
  # qwen3.8:27b, glm-ocr:latest) ganham DUAS entradas com o mesmo
  # model_name — o Router do LiteLLM (routing_strategy: least-busy +
  # num_retries, já configurado abaixo) trata isso como um pool e faz
  # retry/cooldown automático se uma das duas falhar, sem precisar de
  # lógica de fallback separada. ceos vem primeiro porque é o confirmado
  # funcionando agora (vlab trava em POST — ver "Status conhecido" no
  # readme); se a UFSC resolver o DGX, o pool já absorve isso sozinho.
  # timeout em 90s: cobre um cold-load real (~40-45s, medido) sem esperar
  # os 600s antigos num travamento de verdade do vlab.

  # 72B no ceos (confirmado) + 125B MoE no vlab (trava hoje, mas fica no
  # pool pra quando for corrigido) — nenhum cabe nos 12GB do Apollo.
  - model_name: ufsc-frontier
    litellm_params:
      model: openai/qwen2.5:72b
      api_base: os.environ/UFSC_CEOS_OLLAMA_API_BASE
      api_key: "none"
      timeout: 90
  - model_name: ufsc-frontier
    litellm_params:
      model: openai/qwen3.5:122b
      api_base: os.environ/UFSC_OLLAMA_API_BASE
      api_key: "none"
      extra_headers:
        Authorization: os.environ/UFSC_OLLAMA_AUTH_HEADER
      timeout: 90

  # Preenche família que falta — nenhum Llama configurado hoje (Apollo e
  # OpenRouter free atual não têm nenhum).
  - model_name: ufsc-llama70b
    litellm_params:
      model: openai/llama3.3:70b
      api_base: os.environ/UFSC_CEOS_OLLAMA_API_BASE
      api_key: "none"
      timeout: 90
  - model_name: ufsc-llama70b
    litellm_params:
      model: openai/llama3.3:70b
      api_base: os.environ/UFSC_OLLAMA_API_BASE
      api_key: "none"
      extra_headers:
        Authorization: os.environ/UFSC_OLLAMA_AUTH_HEADER
      timeout: 90

  # Primeiro modelo com visão em todo o stack — nem Apollo nem OpenRouter
  # free atual têm capability de imagem configurada.
  - model_name: ufsc-vision
    litellm_params:
      model: openai/qwen3.8:27b
      api_base: os.environ/UFSC_CEOS_OLLAMA_API_BASE
      api_key: "none"
      timeout: 90
  - model_name: ufsc-vision
    litellm_params:
      model: openai/qwen3.8:27b
      api_base: os.environ/UFSC_OLLAMA_API_BASE
      api_key: "none"
      extra_headers:
        Authorization: os.environ/UFSC_OLLAMA_AUTH_HEADER
      timeout: 90

  # Modelo especializado em OCR — categoria própria, nada parecido no
  # resto do stack (não é um vision-chat genérico, é dedicado a extração
  # de texto de imagem/documento).
  - model_name: ufsc-ocr
    litellm_params:
      model: openai/glm-ocr:latest
      api_base: os.environ/UFSC_CEOS_OLLAMA_API_BASE
      api_key: "none"
      timeout: 90
  - model_name: ufsc-ocr
    litellm_params:
      model: openai/glm-ocr:latest
      api_base: os.environ/UFSC_OLLAMA_API_BASE
      api_key: "none"
      extra_headers:
        Authorization: os.environ/UFSC_OLLAMA_AUTH_HEADER
      timeout: 90

litellm_settings:
  success_callback: ["langfuse"]
  failure_callback: ["langfuse"]
  request_timeout: 600

router_settings:

  routing_strategy: least-busy
  num_retries: 5
  timeout: 600

  # All free OpenRouter models as fallbacks for maximum availability
  fallback_models:
    - openrouter/nex-agi/nex-n2-pro:free
    - openrouter/nvidia/nemotron-3.5-content-safety:free
    - openrouter/nvidia/nemotron-3-ultra-550b-a55b:free
    - openrouter/nvidia/nemotron-3-nano-omni-30b-a3b-reasoning:free
    - openrouter/poolside/laguna-xs.2:free
    - openrouter/poolside/laguna-m.1:free
    - openrouter/google/gemma-4-26b-a4b-it:free
    - openrouter/google/gemma-4-31b-it:free
    - openrouter/nvidia/nemotron-3-super-120b-a12b:free
    - openrouter/openrouter/free
    - openrouter/liquid/lfm-2.5-1.2b-thinking:free
    - openrouter/liquid/lfm-2.5-1.2b-instruct:free
    - openrouter/nvidia/nemotron-3-nano-30b-a3b:free
    - openrouter/nvidia/nemotron-nano-12b-v2-vl:free
    - openrouter/qwen/qwen3-next-80b-a3b-instruct:free
    - openrouter/nvidia/nemotron-nano-9b-v2:free
    - openrouter/openai/gpt-oss-120b:free
    - openrouter/openai/gpt-oss-20b:free
    - openrouter/qwen/qwen3-coder:free
    - openrouter/cognitivecomputations/dolphin-mistral-24b-venice-edition:free

