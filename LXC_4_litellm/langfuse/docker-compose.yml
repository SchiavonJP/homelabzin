services:

  langfuse-web:
    image: langfuse/langfuse:3
    container_name: sb_langfuse
    restart: unless-stopped
    depends_on:
      langfuse-worker:
        condition: service_started
      clickhouse:
        condition: service_healthy
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: ${LANGFUSE_DATABASE_URL}
      CLICKHOUSE_MIGRATION_URL: ${CLICKHOUSE_MIGRATION_URL}
      CLICKHOUSE_URL: ${CLICKHOUSE_URL}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      REDIS_CONNECTION_STRING: ${REDIS_CONNECTION_STRING}
      NEXTAUTH_URL: https://langfuse.joaopaulo.me
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      SALT: ${SALT}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      LANGFUSE_INIT_ORG_ID: homelab
      LANGFUSE_INIT_ORG_NAME: Homelab
      LANGFUSE_INIT_PROJECT_ID: litellm
      LANGFUSE_INIT_PROJECT_NAME: LiteLLM
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_ADMIN_EMAIL}
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_ADMIN_PASSWORD}
      LANGFUSE_S3_UPLOAD_ENABLED: "false"
      LANGFUSE_S3_MEDIA_UPLOAD_ENABLED: "false"
    networks:
      - observability
    deploy:
      resources:
        limits:
          memory: 512m

  langfuse-worker:
    image: langfuse/langfuse-worker:3
    container_name: sb_langfuse_worker
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      DATABASE_URL: ${LANGFUSE_DATABASE_URL}
      CLICKHOUSE_MIGRATION_URL: ${CLICKHOUSE_MIGRATION_URL}
      CLICKHOUSE_URL: ${CLICKHOUSE_URL}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      REDIS_CONNECTION_STRING: ${REDIS_CONNECTION_STRING}
      SALT: ${SALT}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      LANGFUSE_S3_UPLOAD_ENABLED: "false"
      LANGFUSE_S3_MEDIA_UPLOAD_ENABLED: "false"
    networks:
      - observability
    deploy:
      resources:
        limits:
          memory: 256m

  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    container_name: sb_clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./clickhouse-config.xml:/etc/clickhouse-server/config.d/memory.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    security_opt:
      - seccomp:unconfined
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' 2>/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - observability
    deploy:
      resources:
        limits:
          memory: 1g

volumes:
  clickhouse_data:

networks:
  observability:
    name: sb_observability
    driver: bridge
