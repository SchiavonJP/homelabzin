# Do not let strongSwan replace resolv.conf with the UFSC DNS (150.162.2.2):
# it does not answer through this tunnel and broke every lookup in the shared
# network namespace (LiteLLM included). vLab/CEOS hosts resolve publicly;
# containers use Docker DNS -> local unbound cache on this CT (2026-11-25).
resolve {
    load = no
}
