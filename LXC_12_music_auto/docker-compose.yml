services:

  slskd:
    image: slskd/slskd:latest
    container_name: sb_slskd
    restart: unless-stopped
    ports:
      - "5030:5030"
      - "50300:50300"
    volumes:
      - slskd_config:/app
      - /mnt/media/downloads:/downloads
      - /mnt/media/music:/music:ro
    environment:
      TZ: America/Sao_Paulo
      SLSKD_REMOTE_CONFIGURATION: "true"
      SLSKD_DOWNLOADS_DIR: /downloads/slskd
      SLSKD_INCOMPLETE_DIR: /downloads/slskd/incomplete
      SLSKD_SHARED_DIR: /music
    networks:
      - music_auto
    deploy:
      resources:
        limits:
          memory: 512m

  soularr:
    image: mrusse08/soularr:latest
    container_name: sb_soularr
    restart: unless-stopped
    volumes:
      - soularr_config:/data
      - /mnt/media/downloads:/downloads
    environment:
      TZ: America/Sao_Paulo
      LIDARR_URL: http://192.168.0.219:8686
      LIDARR_API_KEY: ${LIDARR_API_KEY}
      SLSKD_URL: http://slskd:5030
      SLSKD_API_KEY: ${SLSKD_API_KEY}
      DOWNLOAD_FOLDER: /downloads/slskd
    networks:
      - music_auto
    depends_on:
      - slskd
    deploy:
      resources:
        limits:
          memory: 256m

  beets:
    image: lscr.io/linuxserver/beets:latest
    container_name: sb_beets
    restart: unless-stopped
    volumes:
      - beets_config:/config
      - /mnt/media/music:/music
      - /mnt/media/downloads:/downloads
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/Sao_Paulo
    networks:
      - music_auto
    deploy:
      resources:
        limits:
          memory: 256m

volumes:
  slskd_config:
  soularr_config:
  beets_config:

networks:
  music_auto:
    name: sb_music_auto
    driver: bridge
