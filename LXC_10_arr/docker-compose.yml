services:

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: sb_flaresolverr
    restart: unless-stopped
    ports:
      - "8191:8191"
    environment:
      TZ: America/Sao_Paulo
      LOG_LEVEL: info
    networks:
      - arr
    deploy:
      resources:
        limits:
          memory: 512m

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: sb_prowlarr
    restart: unless-stopped
    ports:
      - "9696:9696"
    volumes:
      - prowlarr_config:/config
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/Sao_Paulo
    networks:
      - arr
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9696/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512m

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: sb_radarr
    restart: unless-stopped
    ports:
      - "7878:7878"
    volumes:
      - radarr_config:/config
      - /mnt/media/movies:/movies
      - /mnt/media/downloads:/downloads
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/Sao_Paulo
    networks:
      - arr
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:7878/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512m

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sb_sonarr
    restart: unless-stopped
    ports:
      - "8989:8989"
    volumes:
      - sonarr_config:/config
      - /mnt/media/tv:/tv
      - /mnt/media/downloads:/downloads
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/Sao_Paulo
    networks:
      - arr
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8989/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512m

  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: sb_lidarr
    restart: unless-stopped
    ports:
      - "8686:8686"
    volumes:
      - lidarr_config:/config
      - /mnt/media/music:/music
      - /mnt/media/downloads:/downloads
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/Sao_Paulo
    networks:
      - arr
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8686/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 512m

  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: sb_bazarr
    restart: unless-stopped
    ports:
      - "6767:6767"
    volumes:
      - bazarr_config:/config
      - /mnt/media/movies:/movies:ro
      - /mnt/media/tv:/tv:ro
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/Sao_Paulo
    networks:
      - arr
    deploy:
      resources:
        limits:
          memory: 512m

volumes:
  prowlarr_config:
  radarr_config:
  sonarr_config:
  lidarr_config:
  bazarr_config:

networks:
  arr:
    name: sb_arr
    driver: bridge
