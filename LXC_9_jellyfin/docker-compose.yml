services:

  jellyfin:
    image: jellyfin/jellyfin:12.1
    container_name: sb_jellyfin
    restart: unless-stopped
    ports:
      - "8096:8096"
      - "8920:8920"
    volumes:
      - jellyfin_config:/config
      - jellyfin_cache:/cache
      - /mnt/media/movies:/media/movies:ro
      - /mnt/media/tv:/media/tv:ro
    environment:
      TZ: America/Sao_Paulo
      JELLYFIN_PublishedServerUrl: https://jellyfin.joaopaulo.me
    networks:
      - media
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8096/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 4g

  seerr:
    image: ghcr.io/seerr-team/seerr:v3.4.1
    container_name: sb_seerr
    restart: unless-stopped
    init: true
    depends_on:
      - jellyfin
    ports:
      - "5055:5055"
    volumes:
      - seerr_config:/app/config
    environment:
      TZ: America/Sao_Paulo
      LOG_LEVEL: info
    networks:
      - media
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5055/api/v1/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512m

volumes:
  jellyfin_config:
  jellyfin_cache:
  seerr_config:

networks:
  media:
    name: sb_media
    driver: bridge
