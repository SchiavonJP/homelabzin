services:

  metube:
    image: ghcr.io/alexta69/metube:latest
    container_name: metube
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      - /storage/downloads:/downloads
      - /storage/music:/music
    environment:
      TZ: America/Sao_Paulo
      DOWNLOAD_DIR: /downloads
      AUDIO_DOWNLOAD_DIR: /music
    deploy:
      resources:
        limits:
          memory: 512m
