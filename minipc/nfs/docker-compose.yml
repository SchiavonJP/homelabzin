services:

  nfs:
    image: erichough/nfs-server:latest
    container_name: minipc_nfs
    restart: unless-stopped
    privileged: true
    ports:
      - "2049:2049"
      - "2049:2049/udp"
      - "111:111/tcp"
      - "111:111/udp"
      - "32765:32765"
      - "32765:32765/udp"
      - "32767:32767"
      - "32767:32767/udp"
    volumes:
      - /storage:/storage
    environment:
      NFS_EXPORT_0: "/storage 192.168.0.0/24(rw,sync,no_subtree_check,no_root_squash)"
    deploy:
      resources:
        limits:
          memory: 128m
