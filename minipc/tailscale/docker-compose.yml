name: tailscale
services:

  tailscale:
    image: tailscale/tailscale:v1.90.8
    container_name: tailscale
    hostname: tailscale
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    entrypoint:
      - /bin/sh
      - -c
      - tailscaled --state=/var/lib/tailscale/tailscaled.state & sleep 10;
        tailscale web --listen 0.0.0.0:5252
    volumes:
      - type: bind
        source: /DATA/AppData/tailscale
        target: /var/lib/tailscale
      - type: bind
        source: /dev/net/tun
        target: /dev/net/tun
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_EXTRA_ARGS=--advertise-routes=192.168.0.0/24
    deploy:
      resources:
        limits:
          memory: 256m
