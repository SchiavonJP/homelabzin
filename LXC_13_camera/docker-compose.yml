services:

  motioneye:
    image: motioneyeproject/motioneye:latest
    container_name: sb_camera
    restart: unless-stopped
    ports:
      - "8765:8765"
    devices:
      - /dev/video0:/dev/video0
    volumes:
      - motioneye_config:/etc/motioneye
      - motioneye_media:/var/lib/motioneye
      - /etc/localtime:/etc/localtime:ro
    environment:
      TZ: America/Sao_Paulo
    networks:
      - camera
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8765/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 768m

volumes:
  motioneye_config:
  motioneye_media:

networks:
  camera:
    name: sb_camera
    driver: bridge
