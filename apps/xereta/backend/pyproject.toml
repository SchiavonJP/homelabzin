[project]
name = "xereta"
version = "0.6.0"
requires-python = ">=3.14"
dependencies = [
  "fastapi>=0.141.1,<1", "uvicorn[standard]>=0.38,<1",
  "sqlmodel>=0.0.46,<0.1", "psycopg[binary]>=3.3.6,<4",
  "pydantic-settings>=2.13,<3", "httpx>=0.28,<1",
  "pyjwt>=2.15,<3", "pwdlib[argon2,bcrypt]>=0.3.1,<1",
  "mcp>=1.26,<2", "alembic>=1.19,<2",
]
[dependency-groups]
dev = ["pytest>=8,<10"]
[project.optional-dependencies]
dev = ["pytest>=8,<10"]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["app"]
[tool.pytest.ini_options]
pythonpath = ["."]
