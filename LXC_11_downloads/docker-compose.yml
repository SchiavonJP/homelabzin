services:

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: sb_qbittorrent
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    volumes:
      - qbittorrent_config:/config
      - /mnt/media/downloads:/downloads
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/Sao_Paulo
      WEBUI_PORT: "8080"
    networks:
      - downloads
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1g

  bgutil:
    image: ghcr.io/nickel828/bgutil-ytdlp-pot-provider:latest
    container_name: sb_bgutil
    restart: unless-stopped
    networks:
      - downloads
    deploy:
      resources:
        limits:
          memory: 256m

  metube:
    image: ghcr.io/alexta69/metube:latest
    container_name: sb_metube
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      - metube_state:/state
      - /mnt/media/downloads:/downloads
      - /mnt/media/music:/music
    environment:
      TZ: America/Sao_Paulo
      DOWNLOAD_DIR: /downloads
      AUDIO_DOWNLOAD_DIR: /music
      STATE_DIR: /state
      YTDL_OPTIONS: '{"extractor_args":{"youtube":{"pot_bgutil_baseurl":["http://sb_bgutil:4416"]}}}'
    networks:
      - downloads
    depends_on:
      - bgutil
    deploy:
      resources:
        limits:
          memory: 512m

volumes:
  qbittorrent_config:
  metube_state:

networks:
  downloads:
    name: sb_downloads
    driver: bridge
