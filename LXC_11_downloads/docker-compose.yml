services:

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: sb_qbittorrent
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "6881:6881"
      - "6881:6881/udp"
    volumes:
      - qbittorrent_config:/config
      - /mnt/media/downloads:/downloads
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: America/Sao_Paulo
      WEBUI_PORT: "8080"
    networks:
      - downloads
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1g

volumes:
  qbittorrent_config:

networks:
  downloads:
    name: sb_downloads
    driver: bridge
